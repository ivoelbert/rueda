<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rueda · Toon 3D</title>
<link rel="stylesheet" href="../shared/hud.css">
<style>
  :root {
    --font: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    --fg: #fff;
    --muted: rgba(255, 255, 255, 0.85);
    --accent: #ff4f8b;
    --accent2: #ffd23d;
    --panel: rgba(30, 14, 50, 0.72);
    --btn-bg: #ffd23d;
    --btn-fg: #1a1020;
    --radius: 16px;
    --border: 3px solid #1a1020;
  }
  body { background: #f2a65a; }
  .hud { font-weight: 900; }
  .hud-score .val, .hud-score .lbl, .phase, .judge, .start h1 { -webkit-text-stroke: 2px #1a1020; paint-order: stroke fill; text-shadow: 3px 3px 0 #1a1020; }
  .hud-score .lbl { color: #ffd23d; -webkit-text-stroke: 1px #1a1020; }
  .phase { color: #ffd23d; font-size: 15px; }
  .beat { box-shadow: 3px 3px 0 #1a1020; color: #fff; }
  .beat.on { color: #1a1020; background: #ffd23d; border-color: #1a1020; }
  .beat[data-beat="1"], .beat[data-beat="5"] { border-color: #ff4f8b; }
  .call-btn { border: 4px solid #1a1020; box-shadow: 6px 6px 0 #1a1020; transform: rotate(-2deg); font-style: italic; }
  .call-btn:active { transform: rotate(-2deg) translate(4px, 4px); box-shadow: 2px 2px 0 #1a1020; }
  .side-btn, .hud-nav a { box-shadow: 3px 3px 0 #1a1020; }
  .hud-nav a.here { background: #ff4f8b; color: #fff; }
  .caller { background: #fff; color: #e8283c; border: 4px solid #1a1020; box-shadow: 6px 6px 0 #1a1020; font-style: italic; border-radius: 30px; }
  .judge { font-style: italic; }
  .start { background: radial-gradient(circle, rgba(255, 120, 80, 0.25), rgba(40, 10, 60, 0.75)); }
  .start h1 { color: #ffd23d; font-style: italic; -webkit-text-stroke: 4px #1a1020; text-shadow: 8px 8px 0 #ff4f8b; }
  .start .sub { color: #fff; }
  .start-btn { border: 4px solid #1a1020; box-shadow: 6px 6px 0 #1a1020; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
</head>
<body>
<canvas class="stage" id="stage"></canvas>
<script type="module" src="main.js"></script>
</body>
</html>
