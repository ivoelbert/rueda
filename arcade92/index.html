<link rel="stylesheet" href="../shared/arcade.css">
<style>
  :root {
    --room: #08060c;
    --cab: #1a1420;
    --cab-edge: #3a2440;
    --trim: #c9a227;
    --marquee: #200818;
    --panel: #18141c;
    --panel-art: radial-gradient(circle at 18% 120%, rgba(216, 32, 48, 0.35), transparent 45%), radial-gradient(circle at 82% 120%, rgba(232, 184, 0, 0.25), transparent 45%);

    --card-fg: #f0e6ff;
    --card-accent: #f8c820;
    --btn: #d82030;
    --btn-dark: #600010;
    --btn-light: #ff9090;
    --font: "Arial Black", "Helvetica Neue", Arial, sans-serif;
  }
  .card { font-family: system-ui, sans-serif; border-image: linear-gradient(135deg, #f8c820, #d82030) 1; }
  .card h3 { font-family: var(--font); font-style: italic; }
  .card dt { font-family: ui-monospace, monospace; }
