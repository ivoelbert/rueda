<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUEDA · Guapea</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e080b; touch-action: manipulation; }
  body { display: flex; align-items: center; justify-content: center; font: 12px/1.4 "Courier New", ui-monospace, monospace; color: #f2e6cc; user-select: none; -webkit-user-select: none; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
  button { font: 900 11px "Courier New", ui-monospace, monospace; letter-spacing: 0.1em; cursor: pointer; }
  #tuneBtn { position: fixed; right: 10px; bottom: 10px; z-index: 2; padding: 6px 10px; color: #f2e6cc; background: #24121a; border: 2px solid #c08a3a; box-shadow: 3px 3px 0 #000; }
  #tuneBtn:hover { background: #3a1e24; }
  #tune { position: fixed; top: 10px; right: 10px; z-index: 3; width: 270px; max-height: calc(100% - 64px); overflow: auto; padding: 12px 14px 14px;
    background: #1c1016; border: 3px solid #e8b048; box-shadow: 5px 5px 0 #000; }
  #tune h2 { margin: 0 0 4px; font-size: 13px; letter-spacing: 0.14em; color: #f8d040; }
  #tune p { margin: 0 0 10px; color: #c0a888; font-size: 11px; }
  #tune label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 8px; }
  #tune label b { color: #f8d040; }
  #tune input { grid-column: 1 / -1; width: 100%; accent-color: #e8b048; }
  #tune .buttons { display: flex; gap: 8px; margin-top: 10px; }
  #tune .buttons button { flex: 1; padding: 6px 4px; color: #1c1016; background: #f8d040; border: 0; box-shadow: 2px 2px 0 #000; }
  #tune .buttons button[data-reset] { background: #c0a888; }
  #tune .keys { margin-top: 12px; color: #c0a888; font-size: 11px; }
</style>
</head>
<body>
<canvas id="screen" width="400" height="225"></canvas>
<button id="tuneBtn" title="T">TUNE</button>
<aside id="tune" hidden>
  <h2>TUNE THE FEEL</h2>
  <p>Move the sliders while it plays until the guapea feels right, then copy the link and send it to me.</p>
  <div class="rows"></div>
  <div class="buttons"><button data-copy>COPY LINK</button><button data-reset>RESET</button></div>
  <div class="keys">SPACE tap on 1 and 5 · ◄ ► lead/follow · S ½× speed · M mute · T this panel</div>
</aside>
<script type="module" src="main.js"></script>
</body>
</html>
