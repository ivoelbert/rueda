<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rueda · Neon</title>
<link rel="stylesheet" href="../shared/hud.css">
<style>
  :root {
    --font: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    --accent: #ff3df5;
    --accent2: #3df5ff;
    --panel: rgba(20, 4, 40, 0.6);
    --btn-bg: linear-gradient(180deg, #ff5cf7, #c21fd0);
    --radius: 999px;
    --border: 2px solid rgba(61, 245, 255, 0.45);
  }
  body { background: #05010d; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
  .hud { text-shadow: 0 0 10px currentColor; }
  .beat.on { box-shadow: 0 0 18px var(--accent), 0 0 4px #fff inset; }
  .call-btn { box-shadow: 0 0 24px #ff3df5, 0 0 60px rgba(255, 61, 245, 0.45), inset 0 -4px 0 rgba(0,0,0,0.25); text-shadow: 0 0 8px #fff; }
  .caller { background: transparent; color: #ffe23d; border: 3px solid #ffe23d; box-shadow: 0 0 20px #ffe23d, inset 0 0 14px rgba(255, 226, 61, 0.4); }
  .start { background: radial-gradient(circle, rgba(10,0,30,0.35), rgba(5,1,13,0.9)); }
  .start h1 { color: #fff; text-shadow: 0 0 12px #ff3df5, 0 0 40px #ff3df5, 0 0 80px #ff3df5; font-style: italic; }
  .start-btn { box-shadow: 0 0 30px #ff3df5; }
</style>
</head>
<body>
<canvas class="stage" id="stage"></canvas>
<script type="module" src="main.js"></script>
</body>
</html>
